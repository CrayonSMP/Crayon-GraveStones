name: Build Plugin JAR

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build bGraveStones
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin jar
        run: mvn -B clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: better-GraveStones-jar
          path: target/better-GraveStones-*.jar
          if-no-files-found: error
