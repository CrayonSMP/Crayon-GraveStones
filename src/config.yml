# Better-GraveStones configuration
# everything you see here is customizable in the plugin by you
# if you see exclamation marks at one variable, that means you'll need to restart the server
# after you saved the configuration part which needs a restart, for all other options a reload should do it

# If true, only the owner (dead player) can loot the grave.
# (If this option is enabled, please set allowOthersToLoot to false otherwise a double Error Message appears)
ownerOnly: false

# If true and ownerOnly=false, non-owners may loot graves (drop logic applies).
# (If this option is enabled, please set ownerOnly to false otherwise a double Error Message appears)
allowOthersToLoot: true

# If ownerOnly=false and allowOthersToLoot=true:
# If protectDropsForOpener=true, the first player who loots a grave becomes the "opener"
# and only THEY can pick up the dropped items (until they pick them up and re-drop them).
protectDropsForOpener: true

# Seconds after which "protected drops" become free-for-all automatically (safety net).
# Set to 0 to disable expiry (then only re-dropping makes items free).
protectedDropTimeoutSeconds: 180

# Which block to place as the gravestone.
# Example options: ANDESITE_WALL, BLACKSTONE_WALL, COBBLESTONE_WALL
graveBlock: ANDESITE_WALL

# If the spot is not placeable, we search upward by this many blocks.
# May not work always as expected if in creative or really a player is really high
placementSearchUp: 65

# How far to search downward when placing a grave (fixes ladder / dying in air edge cases)
placementSearchDown: 0

# this variable defines the maximum limit of total graves a player can have if the MySQL Support is not enabled
# !!server restart required!!
graveLimit: 10

# Hologram (gravestone initials name) settings
hologramEnabled: true
hologramOffsetX: 0.00
hologramOffsetY: 0.375
hologramOffsetZ: 0.00
hologramFaceOffset: 0.25 # This entry allows you to set the display more far or near the block
hologramDateFormat: "dd.MM.yyyy\nHH:mm"
hologramFormat: "§7✝ §f{player}\n§7{date}"
hologramFacing: NORTH
# Bigger number means bigger Display Text
hologramTextScale: 0.55

# XP behavior: fraction of the total exp to restore.
xpRestoreFraction: 0.33

# If true, non-owner looters may also take the XP fraction from the grave.
# If false, XP fraction is only given to the owner.
xpStealable: true

# If true and a non-owner loots with xpStealable=true, the XP fraction will be dropped as orbs at the grave location.
# If false, the XP fraction is given directly to the looter.
xpDropAsOrbsForNonOwner: false

# If true, remove the original death drops and keep everything in the grave.
# If false, vanilla drops still happen and the grave is just a marker.
captureDrops: true

# Allow admins to break/remove graves (without looting) with permission graves.admin
adminCanBreak: true

# World blacklist (no graves here) if you want to disable more than one world, seperate each world with an comma e.g. ["world_nether", "world_the_end"]
# Holograms are a bit buggy if a world gets disabled (fixed in next release)
disabledWorlds: []

# Maximum Graves one page lists with /graves list
listPageSize: 10

# Date/time format used in /graves list.
# Uses Java DateTimeFormatter patterns. Example: dd.MM.yyyy HH:mm
listDateFormat: "dd.MM.yyyy HH:mm"

# Permission used to access the teleportation feature on the ingame chat
graveTeleportPermission: "graves.admin.tp"

# player, that are allowed to use the emergency command, if you want to add more players to this list you'll separate them by a comma e.g. ["TamashiiMon", "SLINIcraftet204"]
emergencyPlayers: ["SLINIcraftet204"]

# Change the Sounds for opening a gravestone and if a gravestone is looted successfully or if someone is not allowed to open other graves (applies if isOwner=true)
sounds:
  graveOpen:
    enabled: true
    sound: BLOCK_CHEST_OPEN
    volume: 1.0
    pitch: 1.0

  graveLooted:
    enabled: true
    sound: ITEM_ARMOR_EQUIP_NETHERITE
    volume: 1.0
    pitch: 1.2

  graveError:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.6

# Debug logging. Keep disabled on production unless you are actively investigating issues.
debug:
  mysql: false
  migration: false
  sql: false

# Modrinth update checker.
# Project/API values are fixed internally by the plugin.
updateChecker:
  enabled: true
  checkOnStartup: true
  checkIntervalHours: 12
  notifyOnlineAdmins: true
  notifyAdminsOnJoin: true
  includePrereleases: false
  logErrors: true

# Minecraft 1.21.6+ Locator-Bar integration.
# This version uses only waypoint colors. No resource-pack textures/styles are required.
# Colors can be vanilla names like gray/gold/aqua or hex values like #55FFFF.
locatorBar:
  enabled: false
  # If true, the plugin sets gamerule locatorBar=true for all loaded worlds on enable/reload.
  forceGamerule: true
  commands:
    # true = Vanilla-/Waypoint-Command-Outputs will be suppressed
    # false = you will see the print "Waypoint color is now ..." console
    silent: true

    # true = Plugin is logging all of its own set of commands
    debug: false

  players:
    enabled: false
    # vanilla = leave player waypoint colors untouched
    # fixed = use defaultColor for all players
    # uuid_hash = calculate a stable color from each player's UUID.
    # This mode uses only player-safe colors and never gray/gold/yellow/dark_gray.
    colorMode: "uuid_hash"
    # Used only when colorMode is uuid_hash:
    # solid = one stable safe color per player
    # gradient = animated hex color gradient per player, without gray/gold/yellow tones
    uuidHashStyle: "gradient"
    uuidGradient:
      # How often the animated gradient changes color. 20 ticks = 1 second.
      intervalTicks: 20
      # More steps = smoother transition, but it takes longer to complete one full color cycle.
      steps: 32
    # Used only when colorMode is fixed. Leave empty to keep vanilla/random/team color.
    # gray/gold/yellow/dark_gray are reserved for graves and are ignored for player colors.
    defaultColor: ""
    # 0 = leave vanilla/default transmit range untouched.
    transmitRange: 0
    # Re-apply color sometimes because other plugins or commands may overwrite waypoint settings.
    # If uuidHashStyle=gradient is active, uuidGradient.intervalTicks is used instead.
    reapplyIntervalTicks: 600
    # Keys can be player names or UUIDs. Values must be color names or hex values.
    # gray/gold/yellow/dark_gray are reserved for graves and are ignored here.
    perPlayerColors: {}

  graves:
    enabled: false
    # Normal grave waypoint color.
    color: "gray"
    # Color while at least one player is near the grave.
    # A real separate golden border is not available without a resource-pack style,
    # so the plugin switches the waypoint color and optionally enables entity glow.
    nearColor: "gold"
    # How far the marker entity transmits its waypoint.
    transmitRange: 256
    # If at least one player is this close, nearColor is applied and glowWhenNear can activate.
    nearGlowDistance: 24
    # Enables the vanilla glowing outline on the hidden marker entity while near.
    glowWhenNear: true
    # How often near/far state is checked and marker armor stands are repaired. 40 ticks = 2 seconds.
    updateIntervalTicks: 40
    # Important: true prevents, that a normal Player can see other Gravestone-Markers.
    strictVisibility: true
    privacySafetyMargin: 1.0

    # Normal players only can see own Waypoints.
    # Admins can toggle to see all Waypoints from all players on the server with  /graves locatorall <on|off|toggle>
    viewAllPermission: "graves.admin"

    markerProtection:
      # Protects the hidden armor stand used as the grave locator marker.
      enabled: true
      # Keeps the marker fixed at the grave position and repairs gravity/fire/visibility/etc.
      lockPosition: true
      # Cancels external teleports against the marker. Plugin-internal repair teleports are still allowed.
      cancelTeleport: true
      # If /kill @e or another command/plugin still manages to kill/remove the marker, recreate it automatically.
      respawnIfKilled: true
